# ---- General ----
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1              # Start windows at 1
setw -g pane-base-index 1        # Start panes at 1
set -g renumber-windows on       # Renumber when a window is closed
set -sg escape-time 0            # No delay for escape key
set -g focus-events on

# ---- Prefix ----
# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Splits ----
# Split with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows keep current path
bind c new-window -c "#{pane_current_path}"

# ---- Navigation ----
# Move between panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift+vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ---- Copy Mode (vi) ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ---- Status Bar ----
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold] #S "
set -g status-right "#[fg=yellow]%H:%M #[fg=cyan]%d-%b"
set -g status-left-length 30
set -g status-right-length 50
setw -g window-status-current-style "fg=green,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# ---- Reload config ----
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
